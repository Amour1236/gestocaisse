  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="default"/>
  <meta name="apple-mobile-web-app-title" content="GestoCaisse"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="description" content="GestoCaisse — Logiciel de caisse, stock et rapports pour commerçants africains. Fonctionne hors ligne. Mobile money, OHADA, WhatsApp."/>

<body>
  <noscript>GestoCaisse nécessite JavaScript pour fonctionner.</noscript>
  <div id="root"></div>
  <script>
    // Enregistrement du Service Worker
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function() {
        navigator.serviceWorker.register('/sw.js')
          .then(function(reg) {
            console.log('✅ Service Worker enregistré:', reg.scope);
          })
          .catch(function(err) {
            console.warn('❌ Service Worker échec:', err);
          });
      });
    }
  </script>
</body>
